{% extends 'core/_base.html' %}

{% block content %}
<div class="min-h-[70vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <!-- Brand Icon -->
        <div class="flex justify-center">
            <div class="bg-emerald-100 p-3 rounded-2xl shadow-inner">
                <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                </svg>
            </div>
        </div>
        <h2 class="mt-6 text-center text-3xl font-extrabold text-slate-900 tracking-tight">
            Register Employee
        </h2>
        <p class="mt-2 text-center text-sm text-slate-500">
            Create a new profile to start tracking attendance
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-lg">
        <div class="bg-white py-8 px-6 shadow-sm border border-slate-200 sm:rounded-3xl sm:px-12">
            <form method="post" class="space-y-5">
                {% csrf_token %}
                
                <div class="space-y-1">
                    <!-- Django form fields will be styled by the script in _base.html -->
                    {{ form.as_p }}
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-emerald-100 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-all active:scale-[0.98]">
                        Create Account
                    </button>
                </div>
            </form>

            <!-- Bottom Divider & Redirect -->
            <div class="mt-8 pt-6 border-t border-slate-100">
                <div class="flex flex-col sm:flex-row items-center justify-center gap-2 text-sm">
                    <span class="text-slate-500 font-medium">Already have an account?</span>
                    <a href="{% url 'login' %}" class="text-indigo-600 font-bold hover:text-indigo-500 transition-colors">
                        Sign in instead
                    </a>
                </div>
            </div>
        </div>

        <!-- Security Badge -->
        <div class="mt-8 flex justify-center items-center gap-2 text-slate-400">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
            </svg>
            <span class="text-xs font-semibold uppercase tracking-widest">Enterprise Security Verified</span>
        </div>
    </div>
</div>

<style>
    /* Spacing fixes for Django's as_p output */
    form p {
        margin-bottom: 1.25rem;
    }
    form label {
        display: block;
        font-size: 0.875rem;
        font-weight: 600;
        color: #475569; /* slate-600 */
        margin-bottom: 0.35rem;
        margin-left: 0.25rem;
    }
    /* Specific styling for help text if your Django form uses it */
    form .helptext {
        display: block;
        font-size: 0.75rem;
        color: #94a3b8; /* slate-400 */
        margin-top: 0.25rem;
    }
</style>
{% endblock %}
